name: Build etylizer-ELP

# Builds the etylizer-integrated `elp` binary for Linux, macOS and Windows on every push to dev-etylizer. 
on:
  push:
    branches: [dev-etylizer]
  workflow_dispatch:
    inputs:
      etylizer_ref:
        description: "etylizer branch/tag/sha to bundle"
        type: string
        default: "dev-elp"

env:
  ETYLIZER_REPO: "etylizer/etylizer"
  ETYLIZER_REF: "dev-elp"
  OTP_VERSION: "28.0"
  BREW_OTP_VERSION: "28"

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x64,   runner: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos, arch: x64,   runner: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: macos, arch: arm64, runner: macos-latest,     target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout elp
        uses: actions/checkout@v4

      # Only needed on the arm64 Linux runner (setup-beam's OS map doesn't recognise its ubuntu22-arm64 ImageOS)
      - name: Pin setup-beam ImageOS
        run: echo "ImageOS=ubuntu22" >> "$GITHUB_ENV"

      - name: Setup Erlang/OTP + rebar3
        uses: ./.github/actions/setup-erlang
        with:
          os: ${{ matrix.os }}
          otp-version: ${{ env.OTP_VERSION }}
          brew-otp-version: ${{ env.BREW_OTP_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Stub eqwalizer build inputs
        # eqwalizer is never invoked on the etylizer path; dummy inputs satisfy its build scripts.
        run: |
          STUB="$RUNNER_TEMP/eqwstub"
          mkdir -p "$STUB/eqwalizer" "$STUB/eqwalizer_support"
          printf dummy > "$STUB/eqwalizer.jar"
          printf '%% placeholder\n' > "$STUB/eqwalizer_support/placeholder.erl"
          echo "ELP_EQWALIZER_PATH=$STUB/eqwalizer.jar" >> "$GITHUB_ENV"
          echo "EQWALIZER_DIR=$STUB/eqwalizer" >> "$GITHUB_ENV"

      - name: Checkout etylizer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ETYLIZER_REPO }}
          ref: ${{ github.event.inputs.etylizer_ref || env.ETYLIZER_REF }}
          path: etylizer-src
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build etylizer escript + espresso
        working-directory: etylizer-src
        run: rebar3 escriptize

      - name: Bundle escript, espresso and version into elp
        run: |
          SRC="$GITHUB_WORKSPACE/etylizer-src"
          test -f "$SRC/_build/default/bin/etylizer" || { echo "::error::etylizer escript not built"; exit 1; }
          test -f "$SRC/_build/espresso" || { echo "::error::espresso not built"; exit 1; }
          echo "ELP_ETYLIZER_ESCRIPT=$SRC/_build/default/bin/etylizer" >> "$GITHUB_ENV"
          echo "ELP_ETYLIZER_ESPRESSO=$SRC/_build/espresso" >> "$GITHUB_ENV"
          echo "ELP_ETYLIZER_VERSION=$(git -C "$SRC" rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build elp (release)
        run: cargo build --release --target ${{ matrix.target }} -p elp --bin elp

      - name: Upload elp
        uses: actions/upload-artifact@v4
        with:
          name: elp-etylizer-${{ matrix.os }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/elp
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout elp
        uses: actions/checkout@v4

      - name: Setup Erlang/OTP + rebar3
        uses: ./.github/actions/setup-erlang
        with:
          os: windows
          otp-version: ${{ env.OTP_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      # Setup to compile ISO C99 
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Stub eqwalizer build inputs
        # eqwalizer is never invoked on the etylizer path; dummy inputs satisfy its build scripts.
        run: |
          $stub = "$env:RUNNER_TEMP\eqwstub"
          New-Item -ItemType Directory -Force -Path "$stub\eqwalizer", "$stub\eqwalizer_support" | Out-Null
          Set-Content -NoNewline -Path "$stub\eqwalizer.jar" -Value "dummy"
          Set-Content -Path "$stub\eqwalizer_support\placeholder.erl" -Value "% placeholder"
          "ELP_EQWALIZER_PATH=$stub\eqwalizer.jar" >> $env:GITHUB_ENV
          "EQWALIZER_DIR=$stub\eqwalizer" >> $env:GITHUB_ENV

      - name: Checkout etylizer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ETYLIZER_REPO }}
          ref: ${{ github.event.inputs.etylizer_ref || env.ETYLIZER_REF }}
          path: etylizer-src
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build etylizer escript + espresso
        working-directory: etylizer-src
        shell: cmd
        run: rebar3.cmd escriptize

      - name: Bundle escript, espresso and version into elp
        run: |
          $src = "$env:GITHUB_WORKSPACE\etylizer-src"
          if (-not (Test-Path "$src\_build\default\bin\etylizer")) { Write-Error "etylizer escript not built"; exit 1 }
          if (-not (Test-Path "$src\_build\espresso.exe")) { Write-Error "espresso.exe not built"; exit 1 }
          "ELP_ETYLIZER_ESCRIPT=$src\_build\default\bin\etylizer" >> $env:GITHUB_ENV
          "ELP_ETYLIZER_ESPRESSO=$src\_build\espresso.exe" >> $env:GITHUB_ENV
          "ELP_ETYLIZER_VERSION=$(git -C $src rev-parse --short HEAD)" >> $env:GITHUB_ENV

      - name: Build elp (release)
        # drop jemalloc, see other workflows
        run: cargo build --release --target x86_64-pc-windows-msvc --no-default-features -p elp --bin elp

      - name: Upload elp
        uses: actions/upload-artifact@v4
        with:
          name: elp-etylizer-windows-x64
          path: target/x86_64-pc-windows-msvc/release/elp.exe
          if-no-files-found: error
